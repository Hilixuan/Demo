<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国青企业 Agent 系统 · 一阶段 Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 登录页（深色科技风） -->
    <div id="login-view" class="login-view login-view--tech">
      <!-- 星空背景层 -->
      <div class="login-stars" aria-hidden="true">
        <div class="stars-layer stars-layer--1"></div>
        <div class="stars-layer stars-layer--2"></div>
        <div class="stars-layer stars-layer--3"></div>
      </div>
      <!-- 装饰光斑 -->
      <div class="login-glow login-glow--tl" aria-hidden="true"></div>
      <div class="login-glow login-glow--br" aria-hidden="true"></div>

      <div class="login-tech-inner">
        <!-- 左侧品牌区 -->
        <div class="login-tech-left">
          <!-- 中央智库图标 -->
          <div class="hub-stage" aria-hidden="true">
            <div class="hub-orbit hub-orbit--outer"></div>
            <div class="hub-orbit hub-orbit--mid"></div>
            <div class="hub-orbit hub-orbit--inner"></div>
            <svg class="hub-book" viewBox="0 0 200 200" fill="none">
              <defs>
                <radialGradient id="bookGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#9ad5ff" stop-opacity="1"/>
                  <stop offset="60%" stop-color="#5aa8ff" stop-opacity="0.6"/>
                  <stop offset="100%" stop-color="#5aa8ff" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#cfe6ff"/>
                  <stop offset="100%" stop-color="#7fb3ff"/>
                </linearGradient>
                <linearGradient id="bookPage" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="100%" stop-color="#d6e8ff"/>
                </linearGradient>
              </defs>
              <!-- 光晕底 -->
              <circle cx="100" cy="100" r="92" fill="url(#bookGlow)"/>
              <!-- 外环装饰 -->
              <circle cx="100" cy="100" r="78" stroke="rgba(154,213,255,.4)" stroke-width="1" fill="none" stroke-dasharray="2 4"/>
              <circle cx="100" cy="100" r="64" stroke="rgba(154,213,255,.55)" stroke-width="1" fill="none"/>
              <!-- 书的左页 -->
              <path d="M100 60 L60 72 L60 138 L100 148 Z" fill="url(#bookPage)" stroke="url(#bookCover)" stroke-width="1.2"/>
              <!-- 右页 -->
              <path d="M100 60 L140 72 L140 138 L100 148 Z" fill="url(#bookPage)" stroke="url(#bookCover)" stroke-width="1.2"/>
              <!-- 中线书脊 -->
              <line x1="100" y1="60" x2="100" y2="148" stroke="#5aa8ff" stroke-width="1.2"/>
              <!-- 左页文字行 -->
              <line x1="68" y1="86" x2="94" y2="80" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="68" y1="96" x2="94" y2="90" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="68" y1="106" x2="94" y2="100" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="68" y1="116" x2="90" y2="111" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="68" y1="126" x2="94" y2="120" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <!-- 右页文字行 -->
              <line x1="106" y1="80" x2="132" y2="86" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="106" y1="90" x2="132" y2="96" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="106" y1="100" x2="132" y2="106" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="110" y1="111" x2="132" y2="116" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <line x1="106" y1="120" x2="132" y2="126" stroke="#7fb3ff" stroke-width="1.2" stroke-linecap="round"/>
              <!-- 顶部光束 -->
              <path d="M100 30 L96 56 L104 56 Z" fill="url(#bookGlow)" opacity="0.9"/>
              <line x1="100" y1="20" x2="100" y2="58" stroke="rgba(154,213,255,.7)" stroke-width="1.2" stroke-linecap="round"/>
              <!-- 节点 -->
              <circle cx="100" cy="100" r="3" fill="#bfe2ff"/>
              <circle cx="40" cy="100" r="2.4" fill="#9ad5ff" opacity="0.85"/>
              <circle cx="160" cy="100" r="2.4" fill="#9ad5ff" opacity="0.85"/>
              <circle cx="100" cy="40" r="2" fill="#9ad5ff" opacity="0.7"/>
              <circle cx="100" cy="160" r="2" fill="#9ad5ff" opacity="0.7"/>
            </svg>
            <div class="hub-globe">
              <span class="hub-core"></span>
              <span class="hub-line hub-line--a"></span>
              <span class="hub-line hub-line--b"></span>
              <span class="hub-cardlet hub-cardlet--doc"></span>
              <span class="hub-cardlet hub-cardlet--paper"></span>
              <span class="hub-cardlet hub-cardlet--chart"></span>
              <span class="hub-chip hub-chip--a">AI</span>
              <span class="hub-chip hub-chip--b">AI</span>
            </div>
            <span class="hub-bubble hub-bubble--a"></span>
            <span class="hub-bubble hub-bubble--b"></span>
            <span class="hub-bubble hub-bubble--c"></span>
          </div>

          <!-- 文案 -->
          <h1 class="tech-title">AI 智库中枢</h1>
          <p class="tech-subtitle">组建智库超级智能体矩阵</p>

          <!-- 智能体标签 -->
          <div class="tech-agents">
            <span class="tech-agent-chip"><i class="tech-agent-dot" style="--c:#5eead4"></i>趋势研判专家</span>
            <span class="tech-agent-chip"><i class="tech-agent-dot" style="--c:#a78bfa"></i>产业情报专家</span>
            <span class="tech-agent-chip"><i class="tech-agent-dot" style="--c:#60a5fa"></i>商机侦察员</span>
            <span class="tech-agent-chip"><i class="tech-agent-dot" style="--c:#f0abfc"></i>文书专业写手</span>
          </div>

        </div>

        <!-- 右侧登录卡 -->
        <div class="login-tech-card">
          <div class="login-tech-card-glow" aria-hidden="true"></div>
          <div class="login-tech-card-inner">
            <div class="login-tech-head">
              <h2>统一登录</h2>
            </div>

            <form id="login-form" class="login-tech-form" autocomplete="on">
              <label class="tech-field">
                <span class="tech-field-label">企业帐号</span>
                <span class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2" stroke-linecap="round"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                  <input id="login-account" type="text" value="" autocomplete="username" placeholder="企业账号">
                </span>
              </label>

              <label class="tech-field">
                <span class="tech-field-label">登录密码</span>
                <span class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round"/>
                  </svg>
                  <input id="login-password" type="password" value="" autocomplete="current-password" placeholder="登录密码">
                </span>
              </label>

              <label class="tech-field">
                <span class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" stroke-linecap="round"/>
                  </svg>
                  <select id="login-role" class="tech-select">
                    <option value="申报顾问">申报顾问</option>
                    <option value="项目经理">项目经理</option>
                    <option value="系统管理员">系统管理员</option>
                  </select>
                </span>
              </label>

              <button id="login-btn" type="button" class="tech-login-btn">
                <span>登录系统</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M13 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>

              <div class="login-tech-meta">
                <button type="button" class="tech-link" id="captcha-login-btn">验证码登录</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 主应用 -->
    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">国</span>
          <div>
            <div class="brand-name">国青企业 Agent</div>
            <div class="brand-sub">政策申报协同平台</div>
          </div>
        </div>
        <nav class="side-nav" id="side-nav"></nav>
        <div class="side-user">
          <div class="avatar" id="side-avatar">顾</div>
          <div>
            <div class="side-user-name" id="side-user-name">顾晓岚</div>
            <div class="side-user-role" id="side-user-role">申报顾问</div>
          </div>
          <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录"></button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" title="菜单" aria-label="菜单"></button>
          <div class="crumb" id="crumb">工作台</div>
          <div class="ai-status" title="智库中枢运行状态">
            <span class="ai-status-pulse"></span>
            <span class="ai-status-text">智库中枢 · 7 Agent 在线</span>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="notify-btn" title="通知" aria-label="通知">
              <span class="notify-dot"></span>
            </button>
            <div class="top-user">
              <div class="avatar" id="top-avatar">顾</div>
              <div>
                <div class="top-user-name" id="top-user-name">顾晓岚</div>
                <div class="top-user-role" id="top-user-role">申报顾问</div>
              </div>
            </div>
          </div>
          <div class="dropdown hidden" id="notify-dropdown">
            <div class="dropdown-head">待办与提醒</div>
            <div class="dropdown-list" id="notify-list"></div>
          </div>
        </header>
        <main class="view" id="view"></main>
      </div>
      <!-- 悬浮 AI 智库助手 -->
      <button class="ai-orb" id="ai-orb" title="智库助手" aria-label="智库助手">
        <span class="ai-orb-pulse"></span>
        <span class="ai-orb-pulse ai-orb-pulse--2"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
        </svg>
        <span class="ai-orb-label">智库助手</span>
      </button>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
