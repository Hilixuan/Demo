<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国青企业 Agent 系统 · V2 Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 登录页（V2 科技版） -->
    <div id="login-view" class="login-view login-view--tech">
      <div class="login-stars">
        <div class="stars-layer stars-layer--1"></div>
        <div class="stars-layer stars-layer--2"></div>
        <div class="stars-layer stars-layer--3"></div>
      </div>
      <div class="login-glow login-glow--tl"></div>
      <div class="login-glow login-glow--br"></div>
      <div class="login-tech-inner">
        <div class="login-tech-left">
          <div class="login-tech-logo">
            <span class="tech-logo-mark">国</span>
            <span class="tech-logo-text">国青企业 Agent 系统 V2</span>
          </div>
          <h1 class="tech-title">国青企业 Agent 系统</h1>
          <p class="tech-subtitle">政策申报 · 产业服务 · 智能协同</p>
          <div class="hub-stage">
            <div class="hub-orbit hub-orbit--outer"></div>
            <div class="hub-orbit hub-orbit--mid"></div>
            <div class="hub-orbit hub-orbit--inner"></div>
            <div class="hub-book"></div>
          </div>
          <div class="tech-agents">
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#5eead4"></span>智库 Agent</span>
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#7ea6ff"></span>产业洞察 Agent</span>
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#a78bfa"></span>企业洞察 Agent</span>
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#f0abfc"></span>申报材料 Agent</span>
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#5ad7e3"></span>答辩支持 Agent</span>
            <span class="tech-agent-chip"><span class="tech-agent-dot" style="--c:#86efac"></span>项目权限 Agent</span>
          </div>
          <div class="tech-foot"><span class="tech-foot-dot"></span>本地化部署 · 权限校验 · 全程审计留痕</div>
        </div>
        <div class="login-tech-card">
          <div class="login-tech-card-glow"></div>
          <div class="login-tech-card-inner">
            <div class="login-tech-head">
              <h2>登录演示环境</h2>
              <p>选择演示角色进入系统，数据均为本地演示数据</p>
            </div>
            <form class="login-tech-form">
              <label class="tech-field">
                <span class="tech-field-label">账号</span>
                <div class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <input id="login-account" type="text" value="pm01" autocomplete="username">
                </div>
              </label>
              <label class="tech-field">
                <span class="tech-field-label">密码</span>
                <div class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input id="login-password" type="password" value="demo1234" autocomplete="current-password">
                </div>
              </label>
              <label class="tech-field">
                <span class="tech-field-label">演示角色</span>
                <div class="tech-field-input">
                  <svg class="tech-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                  <select id="login-role" class="tech-select">
                    <option value="申报顾问">申报顾问</option>
                    <option value="项目经理">项目经理</option>
                    <option value="系统管理员">系统管理员</option>
                  </select>
                </div>
              </label>
              <button id="login-btn" class="tech-login-btn" type="button"><span>登录系统</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
              <div class="login-tech-roles">
                <span class="tech-roles-label">快速选择角色</span>
                <button class="role-chip active" data-role="申报顾问">申报顾问</button>
                <button class="role-chip" data-role="项目经理">项目经理</button>
                <button class="role-chip" data-role="系统管理员">系统管理员</button>
              </div>
              <div class="login-tech-hint">演示账号已自动填充，点击登录即可</div>
              <div class="login-tech-meta">
                <button class="tech-link" type="button">忘记密码</button>
                <span class="tech-divider">|</span>
                <button class="tech-link" type="button">部署说明</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="login-tech-foot">国青企业 Agent 系统 V2 演示版 · 本地演示数据</div>
    </div>

    <!-- 主应用 -->
    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">国</span>
          <div>
            <div class="brand-name">国青企业 Agent</div>
            <div class="brand-sub">政策申报协同平台 V2</div>
          </div>
        </div>
        <nav class="side-nav" id="side-nav"></nav>
        <div class="side-user">
          <div class="avatar" id="side-avatar">顾</div>
          <div>
            <div class="side-user-name" id="side-user-name">顾晓岚</div>
            <div class="side-user-role" id="side-user-role">申报顾问</div>
          </div>
          <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录"></button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" title="菜单" aria-label="菜单"></button>
          <div class="crumb" id="crumb">工作台</div>
          <div class="top-search">
            <input id="global-search" type="text" placeholder="搜索功能、企业、政策、文档…">
            <button class="btn btn-ghost btn-sm" id="search-btn">搜索</button>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="notify-btn" title="通知" aria-label="通知">
              <span class="notify-dot"></span>
            </button>
            <div class="top-user">
              <div class="avatar" id="top-avatar">顾</div>
              <div>
                <div class="top-user-name" id="top-user-name">顾晓岚</div>
                <div class="top-user-role" id="top-user-role">申报顾问</div>
              </div>
            </div>
          </div>
          <div class="dropdown hidden" id="notify-dropdown">
            <div class="dropdown-head">待办与提醒</div>
            <div class="dropdown-list" id="notify-list"></div>
          </div>
        </header>
        <main class="view" id="view"></main>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
